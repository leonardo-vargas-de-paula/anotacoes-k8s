apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx-deployment-d4
  name: nginx-deployment-d4
spec: 
  replicas: 3 #1
  selector:
    matchLabels:
      app: nginx-deployment-d4
  strategy: {}
  template:
    metadata:
      labels:
        app: nginx-deployment-d4
    spec:
      containers:
      - image: nginx:1.19.2 #inicialmente apenas nginx
        name: nginx
        resources: 
          limits:
            cpu: "0.5"
            memory: 256Mi
          requests:
            cpu: 0.25
            memory: 128Mi

